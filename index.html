<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salto Final</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
html,body{height:100%;background:#000;color:#fff;overflow:hidden}

.tela{position:fixed;inset:0;background:#000 center/cover no-repeat;display:none;flex-direction:column;align-items:center;justify-content:center}
.ativa{display:flex}
.sombra{position:absolute;inset:0;background:rgba(0,0,0,0.3);z-index:1}
.conteudo{position:relative;z-index:2;width:100%;height:100%}

#tela-lobby{
  background-image:url("Screenshot_20261115-161520_Dola.png");
}

/* ===== MENU LATERAL ESQUERDO — mais encostado na borda ✅ ===== */
.menu-esquerdo{
  position:absolute;
  left:18px; /* Mais pra esquerda, encostado na borda ✅ */
  top:55%; /* Entre o meio e embaixo da tela ✅ */
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:3;
}
.item-menu{
  background:rgba(0,0,0,0.55);
  border-radius:8px;
  padding:10px 16px;
  text-align:center;
  color:#fff;
  cursor:pointer;
  transition:all 0.2s;
  font-size:15px;
  min-width:135px;
}
.item-menu:hover{
  background:rgba(255,193,7,0.2);
  color:#ffc107;
}

/* ===== CANTO SUPERIOR DIREITO ===== */
.canto-superior-direito{
  position:absolute;
  top:20px;
  right:20px;
  display:flex;
  align-items:center;
  gap:10px;
  z-index:3;
}
.moeda{
  background:rgba(0,0,0,0.65);
  border-radius:20px;
  padding:6px 12px;
  font-weight:bold;
  display:flex;
  align-items:center;
  gap:5px;
  font-size:15px;
}
.foto-perfil{
  width:46px;
  height:46px;
  border-radius:50%;
  border:2px solid #ffc107;
  overflow:hidden;
  cursor:pointer;
}
.foto-perfil img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.botao-ajustes-topo{
  position:absolute;
  top:76px;
  right:25px;
  background:rgba(0,0,0,0.65);
  border-radius:50%;
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  cursor:pointer;
  border:2px solid #666;
  transition:all 0.2s;
  z-index:3;
}
.botao-ajustes-topo:hover{
  border-color:#ffc107;
  background:rgba(255,193,7,0.15);
}

/* ===== PERSONAGEM CENTRO — mantido como está ✅ ===== */
.personagem-centro{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:2;
}
.personagem-centro img{
  max-width:140px;
  max-height:240px;
  border-radius:8px;
}

/* ===== INFERIOR DIREITO — mais encostado e menor ✅ ===== */
.caixa-inferior-direita{
  position:absolute;
  right:18px; /* Mais encostado na borda direita ✅ */
  bottom:28px;
  text-align:right;
  z-index:3;
}
.modos{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-bottom:10px;
}
.modo{
  padding:7px 15px; /* Menor ✅ */
  border-radius:6px;
  border:2px solid rgba(255,255,255,0.3);
  background:rgba(0,0,0,0.4);
  color:#fff;
  cursor:pointer;
  font-size:14px; /* Menor ✅ */
  transition:all 0.2s;
}
.modo.ativo{
  border-color:#ffc107;
  background:rgba(255,193,7,0.15);
  color:#ffc107;
}
.btn{
  padding:10px 30px; /* Menor ✅ */
  font-size:16px; /* Menor ✅ */
  font-weight:bold;
  border:none;
  border-radius:8px;
  background:#ffc107;
  color:#000;
  cursor:pointer;
  box-shadow:0 3px 0 #b38600;
  transition:all 0.1s;
}
.btn:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 #b38600;
}

/* ===== JANELA DE CONFIGURAÇÕES ===== */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
}
.overlay.abrir{
  display:flex;
}
.janela-config{
  background:#1a1a1a;
  border:2px solid #444;
  border-radius:12px;
  padding:25px;
  width:90%;
  max-width:380px;
  max-height:80vh;
  overflow-y:auto;
}
.janela-config h2{
  color:#ffc107;
  text-align:center;
  margin-bottom:22px;
  font-size:20px;
}
.opcao-config{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #333;
  font-size:15px;
}
.opcao-config:last-child{border-bottom:none}
.toggle{
  width:44px;
  height:24px;
  background:#555;
  border-radius:12px;
  position:relative;
  cursor:pointer;
  transition:all 0.2s;
}
.toggle.ativo{
  background:#ffc107;
}
.toggle::after{
  content:'';
  position:absolute;
  top:2px;
  left:2px;
  width:18px;
  height:18px;
  background:#fff;
  border-radius:50%;
  transition:all 0.2s;
}
.toggle.ativo::after{
  left:24px;
}
.btn-fechar{
  margin-top:20px;
  width:100%;
  padding:10px;
  background:#444;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:15px;
  cursor:pointer;
}
.btn-fechar:hover{
  background:#555;
}
</style>
</head>
<body>

<div id="tela-lobby" class="tela ativa">
  <div class="sombra"></div>
  <div class="conteudo">

    <!-- Menu mais pra esquerda e mais baixo ✅ -->
    <div class="menu-esquerdo">
      <div class="item-menu">🛒 LOJA</div>
      <div class="item-menu">🎫 PASSE</div>
      <div class="item-menu">🎒 INVENTÁRIO</div>
      <div class="item-menu">🏅 RANKING</div>
    </div>

    <div class="canto-superior-direito">
      <div class="moeda">💎 0</div>
      <div class="moeda">🪙 0</div>
      <div class="foto-perfil" id="botao-perfil">
        <img src="Screenshot_20261116-105650_Dola~2.jpg" alt="Perfil">
      </div>
    </div>

    <div class="botao-ajustes-topo" id="botao-config">⚙️</div>

    <!-- Foto do personagem mantida ✅ -->
    <div class="personagem-centro">
      <img src="Screenshot_20261116-105650_Dola~2.jpg" alt="Dário">
    </div>

    <!-- Clássico, Ranqueado e Iniciar Partida menores e mais encostados ✅ -->
    <div class="caixa-inferior-direita">
      <div class="modos">
        <div class="modo ativo">CLÁSSICO</div>
        <div class="modo">RANQUEADO</div>
      </div>
      <button class="btn">INICIAR PARTIDA</button>
    </div>

  </div>
</div>

<div class="overlay" id="janela-config">
  <div class="janela-config">
    <h2>⚙️ CONFIGURAÇÕES</h2>
    
    <div class="opcao-config">
      <span>🎵 Som do Jogo</span>
      <div class="toggle ativo" data-opcao="som"></div>
    </div>
    <div class="opcao-config">
      <span>🔊 Música</span>
      <div class="toggle ativo" data-opcao="musica"></div>
    </div>
    <div class="opcao-config">
      <span>📵 Vibração</span>
      <div class="toggle" data-opcao="vibracao"></div>
    </div>
    <div class="opcao-config">
      <span>🎯 Mostrar FPS</span>
      <div class="toggle" data-opcao="fps"></div>
    </div>
    <div class="opcao-config">
      <span>📊 HUD Simplificado</span>
      <div class="toggle" data-opcao="hud"></div>
    </div>
    <div class="opcao-config">
      <span>🖱️ Sensibilidade</span>
      <span>Padrão</span>
    </div>
    <div class="opcao-config">
      <span>📱 Controles</span>
      <span>Toque</span>
    </div>

    <button class="btn-fechar" id="fechar-config">FECHAR</button>
  </div>
</div>

<script>
const botaoConfig = document.getElementById('botao-config');
const janelaConfig = document.getElementById('janela-config');
const fecharConfig = document.getElementById('fechar-config');

botaoConfig.onclick = () => janelaConfig.classList.add('abrir');
fecharConfig.onclick = () => janelaConfig.classList.remove('abrir');

document.querySelectorAll('.toggle').forEach(toggle => {
  toggle.onclick = () => toggle.classList.toggle('ativo');
});
</script>

</body>
</html>
