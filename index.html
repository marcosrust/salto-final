<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salto Final</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
html,body{height:100%;overflow:hidden;background:#000;color:#fff}
.tela{position:fixed;inset:0;background:#000 center/cover no-repeat;display:none;flex-direction:column;align-items:center;justify-content:center}
#tela-carregamento{display:flex;justify-content:flex-end;padding-bottom:15vh;background-image:url("Screenshot_20261115-133440_Dola~2.jpg")}
.sombra{position:absolute;inset:0;background:rgba(0,0,0,0.5)}
.conteudo{position:relative;z-index:1;text-align:center;width:100%;padding:20px}
.txt-carregando{font-size:22px;margin-bottom:20px;text-shadow:0 2px 4px #000}
.barra-fundo{width:300px;height:14px;border-radius:7px;background:rgba(0,0,0,0.5);border:2px solid #fff3;margin:0 auto 10px}
.barra-progresso{width:0;height:100%;background:linear-gradient(90deg,#ff6f00,#ffc107);transition:width 0.1s}
.porcentagem{font-size:16px;color:#ffc107;margin-bottom:30px}
.btn{padding:12px 40px;font-size:20px;font-weight:bold;border:none;border-radius:8px;background:#ffc107;color:#000;cursor:pointer;box-shadow:0 4px 0 #b38600}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b38600}
.caixa{background:rgba(0,0,0,0.7);padding:30px;border-radius:12px;text-align:center;max-width:340px;width:90%}
.caixa h2{color:#ffc107;margin-bottom:20px;font-size:22px}
.campo-nome{width:100%;padding:12px;font-size:18px;border:2px solid #ffc107;border-radius:6px;background:rgba(0,0,0,0.5);color:#fff;text-align:center;margin-bottom:10px}
.erro{color:#ff6b6b;font-size:14px;height:20px;margin-bottom:10px}
.personagens{display:flex;gap:20px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.card{background:#1a1a1a;border:3px solid #444;border-radius:10px;padding:15px;cursor:pointer;transition:border 0.2s;width:150px}
.card.selecionado{border-color:#ffc107;background:#2a2a2a}
.card img{width:100%;height:150px;object-fit:cover;border-radius:6px;margin-bottom:10px}
.card span{display:block;font-size:18px;font-weight:bold;color:#ffc107}
#tela-lobby{background-image:url("Screenshot_20261115-161520_Dola~2.jpg")}
.personagem-centro{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center}
.personagem-centro img{max-width:250px;max-height:400px}
.nome-jogador{margin-top:10px;font-size:18px;color:#fff;text-shadow:0 2px 4px #000}
.canto-superior{position:absolute;top:20px;right:20px;display:flex;gap:10px;align-items:center}
.moeda{background:rgba(0,0,0,0.6);border-radius:20px;padding:6px 12px;font-weight:bold}
.avatar{width:40px;height:40px;border-radius:50%;background:#ffc107;color:#000;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #fff}
.lado-esquerdo{position:absolute;left:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.item-lado{background:rgba(0,0,0,0.5);border-radius:8px;padding:10px 15px;text-align:center;cursor:pointer;border:1px solid #fff2;color:#fff}
.lado-inferior{position:absolute;right:30px;bottom:40px;text-align:right}
.modos{display:flex;gap:8px;margin-bottom:15px;justify-content:flex-end}
.modo{padding:8px 18px;border-radius:6px;border:2px solid #fff3;background:rgba(0,0,0,0.4);color:#fff;font-weight:bold}
.modo.ativo{border-color:#ffc107;color:#ffc107}
.escondido{display:none !important}
</style>
</head>
<body>

<!-- CARREGAMENTO -->
<div id="tela-carregamento" class="tela">
  <div class="sombra"></div>
  <div class="conteudo">
    <div class="txt-carregando">CARREGANDO PARTIDA...</div>
    <div class="barra-fundo"><div id="barra" class="barra-progresso"></div></div>
    <div class="porcentagem" id="pct">0%</div>
    <button id="btn-iniciar" class="btn escondido">INICIAR JOGO</button>
  </div>
</div>

<!-- NOME -->
<div id="tela-nome" class="tela">
  <div class="sombra"></div>
  <div class="caixa">
    <h2>SEU NOME</h2>
    <input type="text" id="nome-input" class="campo-nome" placeholder="Digite seu nome" maxlength="12">
    <div class="erro" id="nome-erro"></div>
    <button id="btn-nome" class="btn">CONFIRMAR</button>
  </div>
</div>

<!-- PERSONAGEM -->
<div id="tela-personagem" class="tela">
  <div class="sombra"></div>
  <div class="caixa">
    <h2>ESCOLHA SEU PERSONAGEM</h2>
    <div class="personagens">
      <div class="card" data-pers="dario">
        <img src="Screenshot_20261116-105650_Dola~2.jpg" alt="Dario" onerror="this.src='#'">
        <span>DARIO</span>
      </div>
      <div class="card" data-pers="lara">
        <img src="Screenshot_20261116-105716_Dola~2.jpg" alt="Lara" onerror="this.src='#'">
        <span>LARA</span>
      </div>
    </div>
    <button id="btn-pers" class="btn escondido">CONFIRMAR</button>
  </div>
</div>

<!-- LOBBY -->
<div id="tela-lobby" class="tela">
  <div class="sombra"></div>
  <div class="canto-superior">
    <div class="moeda">💎 0</div>
    <div class="moeda">🪙 0</div>
    <div class="avatar" id="botao-perfil">S</div>
  </div>
  <div class="personagem-centro">
    <img id="img-pers" src="" alt="">
    <div class="nome-jogador" id="nome-jogador"></div>
  </div>
  <div class="lado-esquerdo">
    <div class="item-lado">🛒 LOJA</div>
    <div class="item-lado">🎫 PASSE</div>
    <div class="item-lado">🎒 INVENTÁRIO</div>
  </div>
  <div class="lado-inferior">
    <div class="modos">
      <div class="modo ativo">CLÁSSICO</div>
      <div class="modo">RANQUEADO</div>
    </div>
    <button class="btn">INICIAR PARTIDA</button>
  </div>
</div>

<script>
// Elementos
const telaCarreg = document.getElementById('tela-carregamento');
const telaNome = document.getElementById('tela-nome');
const telaPers = document.getElementById('tela-personagem');
const telaLobby = document.getElementById('tela-lobby');
const barra = document.getElementById('barra');
const pct = document.getElementById('pct');
const btnIniciar = document.getElementById('btn-iniciar');
const nomeInput = document.getElementById('nome-input');
const nomeErro = document.getElementById('nome-erro');
const btnNome = document.getElementById('btn-nome');
const cardsPers = document.querySelectorAll('.card');
const btnPers = document.getElementById('btn-pers');
const imgPers = document.getElementById('img-pers');
const nomeJogador = document.getElementById('nome-jogador');

// Dados salvos
let nomeSalvo = localStorage.getItem('salto_nome') || '';
let persSalvo = localStorage.getItem('salto_pers') || '';
let persEscolhido = '';

function mostrar(tela){
  document.querySelectorAll('.tela').forEach(t=>t.style.display='none');
  tela.style.display='flex';
}

// Carregamento
let prog=0;
const carregar=setInterval(()=>{
  prog+=Math.random()*10;
  if(prog>=100){
    prog=100;
    clearInterval(carregar);
    pct.textContent='PRONTO!';
    btnIniciar.classList.remove('escondido');
  }else{
    pct.textContent=Math.floor(prog)+'%';
  }
  barra.style.width=prog+'%';
},150);

// Botão INICIAR JOGO
btnIniciar.onclick=()=>{
  if(nomeSalvo && persSalvo){
    carregarLobby();
  }else if(!nomeSalvo){
    mostrar(telaNome);
    nomeInput.value='';
    nomeErro.textContent='';
  }else{
    mostrar(telaPers);
  }
};

// Confirmar nome
btnNome.onclick=()=>{
  const n=nomeInput.value.trim();
  if(n.length<2){
    nomeErro.textContent='Mínimo 2 letras';
    return;
  }
  nomeSalvo=n;
  localStorage.setItem('salto_nome',n);
  mostrar(telaPers);
};

// Escolher personagem
cardsPers.forEach(card=>{
  card.onclick=()=>{
    cardsPers.forEach(c=>c.classList.remove('selecionado'));
    card.classList.add('selecionado');
    persEscolhido=card.dataset.pers;
    btnPers.classList.remove('escondido');
  };
});

// Confirmar personagem
btnPers.onclick=()=>{
  if(!persEscolhido)return;
  persSalvo=persEscolhido;
  localStorage.setItem('salto_pers',persEscolhido);
  carregarLobby();
};

function carregarLobby(){
  const imgDario='Screenshot_20261116-105650_Dola~2.jpg';
  const imgLara='Screenshot_20261116-105716_Dola~2.jpg';
  if(persSalvo==='dario'){
    imgPers.src=imgDario;
  }else if(persSalvo==='lara'){
    imgPers.src=imgLara;
  }
  nomeJogador.textContent='Jogador: '+nomeSalvo;
  mostrar(telaLobby);
}
</script>
</body>
</html>
