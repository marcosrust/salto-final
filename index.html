<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Salto Final</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#000;color:white;font-family:Arial,sans-serif;
  user-select:none;-webkit-user-select:none;
}
.tela{
  position:fixed;inset:0;
  background:#000 center/cover no-repeat;
}
.sombra{position:absolute;inset:0;background:linear-gradient(to top,#000c,transparent 55%)}
.escura{position:absolute;inset:0;background:#000a}

#abertura,#nome,#pers{
  background-image:url("Screenshot_20261115-153556_Fotos~2.jpg");
}
#nome,#pers,#lobby,#carregando,#sala{display:none}
#lobby{background-image:url("Screenshot_20261115-133440_Dola.png")}

button{
  padding:14px 30px;font-size:19px;font-weight:bold;
  border:0;border-radius:10px;background:#ffb300;color:#222;
  box-shadow:0 5px 0 #a66f00;
  touch-action:none;
}
button:active{transform:translateY(3px)}
button.peq{
  padding:8px 14px;font-size:14px;
  background:#000c;color:white;box-shadow:none;
  border:1px solid #fff6;
}

/* CARREGAMENTO */

.base{
  position:absolute;bottom:6%;left:0;right:0;
  display:flex;flex-direction:column;
  align-items:center;gap:10px;
}
#txt{font-weight:bold;letter-spacing:2px}
#carga{
  width:60%;height:14px;border:2px solid #fff8;
  border-radius:10px;overflow:hidden;background:#0008;
}
#barra{
  width:0;height:100%;
  background:linear-gradient(90deg,#ff6f00,#ffb300);
}
#pct{color:#ffe082}

/* CAIXAS */

.caixa{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  background:#000d;padding:22px;
  border-radius:14px;display:flex;
  flex-direction:column;gap:12px;
  align-items:center;min-width:280px;
}
.caixa h2{margin:0;color:#ffb300;text-align:center}
#inpNome{
  width:100%;padding:12px;font-size:20px;
  border-radius:8px;border:2px solid #ffb300;
  background:#111;color:white;text-align:center;
}
#erro{color:#ff8a80;font-size:14px}
.cards{display:flex;gap:12px}
.card{
  width:130px;padding:12px 5px;
  background:#111c;border:2px solid #fff5;
  border-radius:12px;text-align:center;font-weight:bold;
}
.card svg{width:75px;height:75px;display:block;margin:auto}

/* LOBBY */

.moedas{
  position:absolute;top:3%;right:2.5%;
  display:flex;gap:8px;align-items:center;
}
.pilula{
  background:#000b;border:1px solid #fff4;
  border-radius:20px;padding:7px 12px;font-weight:bold;
}
#avatar{
  width:42px;height:42px;padding:0;
  border-radius:50%;display:flex;
  align-items:center;justify-content:center;
}
.lateral{
  position:absolute;left:2%;top:50%;
  transform:translateY(-50%);
  display:flex;flex-direction:column;gap:10px;
}
.lat{
  width:75px;padding:10px 4px;
  background:#000b;border:1px solid #fff5;
  border-radius:12px;text-align:center;font-size:11px;
  font-weight:bold;
}
.lat span{display:block;font-size:22px}
.direita{
  position:absolute;right:2.5%;bottom:5%;
  display:flex;flex-direction:column;
  align-items:flex-end;gap:10px;
}
.modos{display:flex;gap:8px}
.modo{
  background:#000b;border:2px solid #fff5;
  border-radius:10px;padding:9px 12px;font-weight:bold;
}
.modo.ativo{border-color:#ffb300;color:#ffb300}
.modo.bloq{opacity:.6}
#iniciar{padding:13px 28px}

/* SALA DE ESPERA */

#sala{
  background:none;
  overflow:hidden;
}

/* CENÁRIO DA ILHA */

#mundo{
  position:absolute;
  inset:-8%;
  background:url("Screenshot_20261115-161520_Dola.png") center/cover no-repeat;
  transform:translate(0,0) scale(1.02);
  will-change:transform;
}

.sala-escura{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,#0009,transparent 35%,#0005);
  pointer-events:none;
}

.topo-sala{
  position:absolute;top:3%;left:0;right:0;
  display:flex;justify-content:space-between;
  align-items:center;padding:0 3%;
  z-index:4;
}
.info-sala{
  background:#000b;border:1px solid #fff5;
  border-radius:10px;padding:10px 14px;
  font-weight:bold;font-size:clamp(12px,2.5vw,18px);
}

/* CONTADOR */

#contador{
  position:absolute;top:17%;left:50%;
  transform:translateX(-50%);
  background:#000c;border:2px solid #ffb300;
  border-radius:14px;padding:12px 25px;
  text-align:center;min-width:160px;
  z-index:4;
}
#tempo{
  color:#ffca28;font-size:clamp(30px,6vw,48px);
  font-weight:bold;
}
#mensagem-tempo{font-size:12px;letter-spacing:2px}

/* JOGADORES */

#vagas{
  position:absolute;bottom:3%;left:50%;
  transform:translateX(-50%);
  background:#000d;border:1px solid #ffb300;
  border-radius:12px;padding:10px 20px;
  font-weight:bold;font-size:clamp(13px,3vw,19px);
  white-space:nowrap;z-index:4;
}

/* PERSONAGEM PROVISÓRIO */

#jogador{
  position:absolute;
  left:50%;
  top:72%;
  width:85px;
  height:145px;
  transform:translate(-50%,-50%);
  transform-origin:center bottom;
  z-index:2;
  pointer-events:none;
  will-change:left,top,transform;
}

#jogador svg{
  width:100%;
  height:100%;
  overflow:visible;
  filter:drop-shadow(0 5px 4px #0009);
}

#jogador.pulando{
  animation:pulo .55s ease;
}
@keyframes pulo{
  0%,100%{margin-top:0}
  45%{margin-top:-65px}
}

#jogador.socando{
  animation:soco .35s ease;
}
@keyframes soco{
  0%,100%{transform:translate(-50%,-50%)}
  40%{transform:translate(-50%,-50%) rotate(-12deg) scale(1.08)}
}

#jogador.deitado{
  transform:translate(-50%,-50%) rotate(90deg) scale(.85);
}

/* CONTROLES DE MOVIMENTO */

#controles{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
}

#direcional{
  position:absolute;
  left:3%;
  bottom:12%;
  width:155px;
  height:145px;
  pointer-events:none;
}

.mov{
  position:absolute;
  width:48px;
  height:48px;
  padding:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:23px;
  color:white;
  background:#000a;
  border:2px solid #fff8;
  border-radius:12px;
  box-shadow:0 3px 0 #0008;
  pointer-events:auto;
}
#cima{left:53px;top:0}
#baixo{left:53px;bottom:0}
#esquerda{left:0;top:48px}
#direitaMov{right:0;top:48px}

#acoes{
  position:absolute;
  right:3%;
  bottom:12%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  pointer-events:none;
}
.acao{
  width:65px;
  height:65px;
  border-radius:50%;
  padding:0;
  font-size:12px;
  color:white;
  background:#000b;
  border:2px solid #fff8;
  box-shadow:0 3px 0 #0008;
  pointer-events:auto;
}
#pular{border-color:#ffca28}
#socar{border-color:#ff7043}
#deitar{border-color:#80cbc4}

#toast{
  position:fixed;left:50%;top:14%;
  transform:translateX(-50%);
  background:#000d;border:1px solid #ffb300;
  padding:10px 18px;border-radius:20px;
  display:none;z-index:10;
}

#perfil{
  position:fixed;inset:0;background:#000b;
  display:none;z-index:8;
}
.av-grande{
  width:70px;height:70px;border-radius:50%;
  background:#ffb300;color:#222;font-size:34px;
  font-weight:bold;display:flex;
  align-items:center;justify-content:center;
}
#pNome{font-size:22px;font-weight:bold}
#pTipo,#pNivel{font-size:14px;color:#ffe082}
.linha{display:flex;gap:10px}

#girar{
  position:fixed;inset:0;background:#000;
  display:none;align-items:center;justify-content:center;
  text-align:center;font-size:20px;z-index:20;
  padding:20px;
}
@media(orientation:portrait){
  #girar{display:flex}
}
</style>
</head>

<body>

<div id="girar">Gire o celular<br>para o modo deitado</div>

<!-- ABERTURA -->

<div id="abertura" class="tela">
  <div class="sombra"></div>
  <div class="base">
    <div id="txt">CARREGANDO PARTIDA...</div>
    <div id="carga"><div id="barra"></div></div>
    <div id="pct">0%</div>
    <button id="comecar" style="display:none">COMEÇAR</button>
  </div>
</div>

<!-- NOME -->

<div id="nome" class="tela">
  <div class="escura"></div>
  <div class="caixa">
    <h2>ESCOLHA SEU NOME</h2>
    <input id="inpNome" maxlength="12" placeholder="Seu nome">
    <div id="erro"></div>
    <button id="confirmar">CONFIRMAR</button>
  </div>
</div>

<!-- PERSONAGEM -->

<div id="pers" class="tela">
  <div class="escura"></div>
  <div class="caixa">
    <h2>ESCOLHA SEU PERSONAGEM</h2>
    <div class="cards">
      <div class="card" id="masc">
        <svg viewBox="0 0 80 80">
          <circle cx="40" cy="44" r="18" fill="#e0b48a"/>
          <path d="M20 40 Q40 6 60 40 L60 34 Q40 0 20 34Z" fill="#4a5a2a"/>
          <rect x="26" y="38" width="28" height="9" rx="4" fill="#111"/>
          <rect x="14" y="62" width="52" height="18" rx="8" fill="#556b2f"/>
        </svg>
        MASCULINO
      </div>
      <div class="card" id="fem">
        <svg viewBox="0 0 80 80">
          <path d="M56 44 Q74 48 66 70 Q60 58 54 54Z" fill="#6b4a2b"/>
          <circle cx="40" cy="44" r="18" fill="#e0b48a"/>
          <path d="M20 40 Q40 6 60 40 L60 34 Q40 0 20 34Z" fill="#4a5a2a"/>
          <rect x="26" y="38" width="28" height="9" rx="4" fill="#111"/>
          <rect x="14" y="62" width="52" height="18" rx="8" fill="#556b2f"/>
        </svg>
        FEMININO
      </div>
    </div>
  </div>
</div>

<!-- LOBBY -->

<div id="lobby" class="tela">
  <div class="sombra"></div>

  <div class="moedas">
    <div class="pilula">💎 <span id="diamantes">0</span></div>
    <div class="pilula">🪙 <span id="ouro">0</span></div>
    <button id="avatar" class="peq">?</button>
  </div>

  <div class="lateral">
    <div class="lat" data-msg="Loja: em breve"><span>🛒</span>LOJA</div>
    <div class="lat" data-msg="Passe: em breve"><span>🎫</span>PASSE</div>
    <div class="lat" data-msg="Inventário: em breve"><span>🎒</span>INVENTÁRIO</div>
  </div>

  <div class="direita">
    <div class="modos">
      <div class="modo ativo" id="mClassico">CLÁSSICO</div>
      <div class="modo bloq" id="mRank">RANQUEADO</div>
    </div>
    <button id="iniciar">INICIAR PARTIDA</button>
  </div>
</div>

<!-- CARREGAMENTO DA ILHA -->

<div id="carregando" class="tela">
  <div class="escura"></div>
  <div class="base">
    <div id="textoCarga">CARREGANDO ILHA...</div>
    <div id="carga">
      <div id="barraIlha" style="width:0;height:100%;background:#ffb300"></div>
    </div>
    <div id="porcentagem">0%</div>
  </div>
</div>

<!-- SALA DE ESPERA -->

<div id="sala" class="tela">

  <div id="mundo"></div>
  <div class="sala-escura"></div>

  <div class="topo-sala">
    <div class="info-sala">🏝️ ILHA DE ESPERA</div>
    <div class="info-sala">SALTO FINAL</div>
  </div>

  <div id="contador">
    <div id="mensagem-tempo">AVIÃO EM</div>
    <div id="tempo">20</div>
    <div>SEGUNDOS</div>
  </div>

  <!-- PERSONAGEM PROVISÓRIO -->

  <div id="jogador">
    <svg viewBox="0 0 100 170">
      <!-- pernas -->
      <path d="M35 105 L30 145 L23 160 L42 160 L48 112Z"
        fill="#263b50" stroke="#111" stroke-width="3"/>
      <path d="M58 105 L64 143 L72 159 L89 159 L80 145 L77 105Z"
        fill="#263b50" stroke="#111" stroke-width="3"/>

      <!-- botas -->
      <path d="M22 153 L42 153 L47 164 L18 164Z" fill="#171717"/>
      <path d="M70 153 L88 153 L94 164 L69 164Z" fill="#171717"/>

      <!-- corpo -->
      <path d="M30 57 Q50 47 70 57 L79 112
        Q50 128 21 112Z"
        fill="#456b45" stroke="#172517" stroke-width="3"/>

      <!-- braços -->
      <path d="M30 62 L15 91 L20 111 L30 107 L27 92 L42 75Z"
        fill="#456b45" stroke="#172517" stroke-width="3"/>
      <path d="M70 62 L85 91 L80 111 L70 107 L73 92 L58 75Z"
        fill="#456b45" stroke="#172517" stroke-width="3"/>

      <!-- mãos -->
      <circle cx="20" cy="112" r="7" fill="#c58d68"/>
      <circle cx="80" cy="112" r="7" fill="#c58d68"/>

      <!-- pescoço -->
      <rect x="42" y="44" width="16" height="18" fill="#c58d68"/>

      <!-- cabeça -->
      <ellipse cx="50" cy="29" rx="19" ry="24"
        fill="#c58d68" stroke="#704a35" stroke-width="2"/>

      <!-- cabelo -->
      <path d="M31 25 Q31 3 50 5 Q69 3 69 25
        Q58 15 48 18 Q39 16 31 25Z"
        fill="#28201b"/>

      <!-- olhos -->
      <circle cx="43" cy="31" r="2" fill="#111"/>
      <circle cx="57" cy="31" r="2" fill="#111"/>

      <!-- colete -->
      <path d="M39 58 L50 76 L61 58 L67 110 L33 110Z"
        fill="#b48b35" opacity=".9"/>
    </svg>
  </div>

  <!-- CONTROLES -->

  <div id="controles">

    <div id="direcional">
      <button class="mov" id="cima" data-dir="cima">▲</button>
      <button class="mov" id="baixo" data-dir="baixo">▼</button>
      <button class="mov" id="esquerda" data-dir="esquerda">◀</button>
      <button class="mov" id="direitaMov" data-dir="direita">▶</button>
    </div>

    <div id="acoes">
      <button class="acao" id="pular">PULAR</button>
      <button class="acao" id="socar">SOCAR</button>
      <button class="acao" id="deitar">DEITAR</button>
    </div>

  </div>

  <div id="vagas">👥 JOGADORES: 1/45</div>
</div>

<!-- PERFIL -->

<div id="perfil">
  <div class="caixa">
    <div class="av-grande" id="pAv">?</div>
    <div id="pNome"></div>
    <div id="pTipo"></div>
    <div id="pNivel">Nível 1</div>
    <div class="linha">
      <button id="trocar" class="peq">TROCAR NOME</button>
      <button id="fechar" class="peq">FECHAR</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
var $=function(i){return document.getElementById(i)};

var abertura=$('abertura');
var telaNome=$('nome');
var telaPers=$('pers');
var lobby=$('lobby');
var carregando=$('carregando');
var sala=$('sala');
var inp=$('inpNome');
var erro=$('erro');
var perfil=$('perfil');
var toast=$('toast');

function mostrar(t){
  [abertura,telaNome,telaPers,lobby,carregando,sala]
  .forEach(function(el){el.style.display='none'});
  t.style.display='block';
}

var avisoTimer;
function aviso(m){
  toast.textContent=m;
  toast.style.display='block';
  clearTimeout(avisoTimer);
  avisoTimer=setTimeout(function(){
    toast.style.display='none';
  },1800);
}

/* CARREGAMENTO INICIAL */

var p=0;
var t=setInterval(function(){
  p+=1.5;
  if(p>=100){
    p=100;
    clearInterval(t);
    $('txt').textContent='PRONTO!';
    $('carga').style.display='none';
    $('pct').style.display='none';
    $('comecar').style.display='block';
  }
  $('barra').style.width=p+'%';
  $('pct').textContent=Math.floor(p)+'%';
},70);

/* DADOS DO JOGADOR */

var salvo='';
var genero='';

try{
  salvo=localStorage.getItem('sf_nome')||'';
  genero=localStorage.getItem('sf_genero')||'';
}catch(e){}

function atualizarPerfil(){
  var ini=(salvo||'?').charAt(0).toUpperCase();
  $('avatar').textContent=ini;
  $('pAv').textContent=ini;
  $('pNome').textContent=salvo;
  $('pTipo').textContent='Personagem '+(genero==='fem'?'feminino':'masculino');
}

/* INÍCIO */

$('comecar').onclick=function(){
  inp.value=salvo;
  mostrar(telaNome);
};

$('confirmar').onclick=function(){
  var n=inp.value.trim();

  if(n.length<2){
    erro.textContent='Escolha um nome com 2 letras ou mais';
    return;
  }

  erro.textContent='';
  salvo=n;

  try{localStorage.setItem('sf_nome',n)}catch(e){}

  mostrar(telaPers);
};

/* PERSONAGEM */

function escolher(g){
  genero=g;
  try{localStorage.setItem('sf_genero',g)}catch(e){}
  atualizarPerfil();
  mostrar(lobby);
}

$('masc').onclick=function(){escolher('masc')};
$('fem').onclick=function(){escolher('fem')};

/* PERFIL */

$('avatar').onclick=function(){
  atualizarPerfil();
  perfil.style.display='block';
};

$('fechar').onclick=function(){
  perfil.style.display='none';
};

$('trocar').onclick=function(){
  perfil.style.display='none';
  inp.value=salvo;
  mostrar(telaNome);
};

/* BOTÕES LATERAIS */

document.querySelectorAll('.lat').forEach(function(el){
  el.onclick=function(){
    aviso(el.getAttribute('data-msg'));
  };
});

/* MODOS */

$('mClassico').onclick=function(){
  aviso('Modo Clássico selecionado');
};

$('mRank').onclick=function(){
  aviso('Ranqueado: em breve');
};

/* MOVIMENTAÇÃO DO PERSONAGEM */

var jogador=$('jogador');
var mundo=$('mundo');

var posX=50;
var posY=72;

var direcoes={};
var velocidade=0.55;
var deitado=false;

function atualizarJogador(){

  posX=Math.max(8,Math.min(92,posX));
  posY=Math.max(30,Math.min(88,posY));

  jogador.style.left=posX+'%';
  jogador.style.top=posY+'%';

  /* Simulação de câmera acompanhando o jogador */

  var camX=(50-posX)*0.16;
  var camY=(65-posY)*0.12;

  mundo.style.transform=
    'translate('+camX+'%, '+camY+'%) scale(1.02)';

  /* Tamanho muda conforme a distância visual */

  var escala=0.65+(posY/100)*0.55;

  if(!deitado){
    jogador.style.transform=
      'translate(-50%,-50%) scale('+escala+')';
  }
}

function mover(){

  if(deitado)return;

  if(direcoes.cima)posY-=velocidade;
  if(direcoes.baixo)posY+=velocidade;
  if(direcoes.esquerda)posX-=velocidade;
  if(direcoes.direita)posX+=velocidade;

  if(direcoes.cima||direcoes.baixo||
     direcoes.esquerda||direcoes.direita){
    atualizarJogador();
  }
}

/* CONTROLES DE TOQUE */

document.querySelectorAll('.mov').forEach(function(botao){

  var direcao=botao.getAttribute('data-dir');

  botao.addEventListener('pointerdown',function(e){
    e.preventDefault();
    direcoes[direcao]=true;
    botao.setPointerCapture(e.pointerId);
  });

  function soltar(){
    direcoes[direcao]=false;
  }

  botao.addEventListener('pointerup',soltar);
  botao.addEventListener('pointercancel',soltar);
  botao.addEventListener('lostpointercapture',soltar);

});

/* TECLADO */

document.addEventListener('keydown',function(e){

  if(sala.style.display==='none')return;

  var tecla=e.key.toLowerCase();

  if(tecla==='w'||tecla==='arrowup')direcoes.cima=true;
  if(tecla==='s'||tecla==='arrowdown')direcoes.baixo=true;
  if(tecla==='a'||tecla==='arrowleft')direcoes.esquerda=true;
  if(tecla==='d'||tecla==='arrowright')direcoes.direita=true;
  if(tecla===' ')pular();

});

document.addEventListener('keyup',function(e){

  var tecla=e.key.toLowerCase();

  if(tecla==='w'||tecla==='arrowup')direcoes.cima=false;
  if(tecla==='s'||tecla==='arrowdown')direcoes.baixo=false;
  if(tecla==='a'||tecla==='arrowleft')direcoes.esquerda=false;
  if(tecla==='d'||tecla==='arrowright')direcoes.direita=false;

});

/* AÇÕES */

function pular(){

  if(sala.style.display==='none'||deitado)return;

  jogador.classList.remove('pulando');
  void jogador.offsetWidth;
  jogador.classList.add('pulando');

  setTimeout(function(){
    jogador.classList.remove('pulando');
  },600);
}

function socar(){

  if(sala.style.display==='none'||deitado)return;

  jogador.classList.remove('socando');
  void jogador.offsetWidth;
  jogador.classList.add('socando');

  setTimeout(function(){
    jogador.classList.remove('socando');
  },400);
}

function alternarDeitado(){

  if(sala.style.display==='none')return;

  deitado=!deitado;

  if(deitado){
    direcoes={
      cima:false,baixo:false,
      esquerda:false,direita:false
    };
    jogador.classList.add('deitado');
    jogador.style.transform='';
    $('deitar').textContent='LEVANTAR';
  }else{
    jogador.classList.remove('deitado');
    $('deitar').textContent='DEITAR';
    atualizarJogador();
  }
}

$('pular').onclick=pular;
$('socar').onclick=socar;
$('deitar').onclick=alternarDeitado;

/* MOVIMENTO CONTÍNUO */

setInterval(mover,30);

/* ENTRADA NA SALA DE ESPERA */

var intervaloIlha=null;
var intervaloTempo=null;

function entrarNaIlha(){

  mostrar(carregando);

  var progresso=0;

  $('barraIlha').style.width='0%';
  $('porcentagem').textContent='0%';
  $('textoCarga').textContent='CARREGANDO ILHA...';

  clearInterval(intervaloIlha);

  intervaloIlha=setInterval(function(){

    progresso+=2;

    if(progresso>=100){
      progresso=100;
      clearInterval(intervaloIlha);

      $('barraIlha').style.width='100%';
      $('porcentagem').textContent='100%';

      setTimeout(iniciarSala,500);
    }

    $('barraIlha').style.width=progresso+'%';
    $('porcentagem').textContent=progresso+'%';

  },45);
}

/* CONTAGEM REGRESSIVA */

function iniciarSala(){

  mostrar(sala);

  /* Posicionamento inicial do jogador */

  posX=50;
  posY=72;
  deitado=false;
  direcoes={
    cima:false,baixo:false,
    esquerda:false,direita:false
  };

  ('pulando','socando','deitado');

  jogador.style.transform='';
  $('deitar').textContent='DEITAR';
  atualizarJogador();

  var segundos=20;
  $('tempo').textContent=segundos;

  clearInterval(intervaloTempo);

  intervaloTempo=setInterval(function(){
    segundos--;

    if(segundos<=0){
      segundos=0;
      clearInterval(intervaloTempo);
      $('tempo').textContent='0';
      $('mensagem-tempo').textContent='AVIÃO PARTINDO!';
      aviso('O avião está partindo!');
      return;
    }

    $('tempo').textContent=segundos;
  },1000);
}

$('iniciar').onclick=entrarNaIlha;
  </script>
