<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Salto Final</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#000;color:white;font-family:Arial,sans-serif;
  user-select:none;-webkit-user-select:none;
}
.tela{
  position:fixed;inset:0;
  background:#000 center/cover no-repeat;
}
.sombra{position:absolute;inset:0;background:linear-gradient(to top,#000c,transparent 55%)}
.escura{position:absolute;inset:0;background:#000a}

#abertura,#nome,#pers{
  background-image:url("Screenshot_20261115-153556_Fotos~2.jpg");
}
#nome,#pers,#lobby,#carregando,#sala{display:none}
#lobby{background-image:url("Screenshot_20261115-133440_Dola.png")}

button{
  padding:14px 30px;font-size:19px;font-weight:bold;
  border:0;border-radius:10px;background:#ffb300;color:#222;
  box-shadow:0 5px 0 #a66f00;
  touch-action:none;
}
button:active{transform:translateY(3px)}
button.peq{
  padding:8px 14px;font-size:14px;
  background:#000c;color:white;box-shadow:none;
  border:1px solid #fff6;
}

/* CARREGAMENTO */

.base{
  position:absolute;bottom:6%;left:0;right:0;
  display:flex;flex-direction:column;
  align-items:center;gap:10px;
}
#txt{font-weight:bold;letter-spacing:2px}
#carga{
  width:60%;height:14px;border:2px solid #fff8;
  border-radius:10px;overflow:hidden;background:#0008;
}
#barra{
  width:0;height:100%;
  background:linear-gradient(90deg,#ff6f00,#ffb300);
}
#pct{color:#ffe082}

/* CAIXAS */

.caixa{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  background:#000d;padding:22px;
  border-radius:14px;display:flex;
  flex-direction:column;gap:12px;
  align-items:center;min-width:280px;
}
.caixa h2{margin:0;color:#ffb300;text-align:center}
#inpNome{
  width:100%;padding:12px;font-size:20px;
  border-radius:8px;border:2px solid #ffb300;
  background:#111;color:white;text-align:center;
}
#erro{color:#ff8a80;font-size:14px}
.cards{display:flex;gap:12px}
.card{
  width:130px;padding:12px 5px;
  background:#111c;border:2px solid #fff5;
  border-radius:12px;text-align:center;font-weight:bold;
}
.card svg{width:75px;height:75px;display:block;margin:auto}

/* LOBBY */

.moedas{
  position:absolute;top:3%;right:2.5%;
  display:flex;gap:8px;align-items:center;
}
.pilula{
  background:#000b;border:1px solid #fff4;
  border-radius:20px;padding:7px 12px;font-weight:bold;
}
#avatar{
  width:42px;height:42px;padding:0;
  border-radius:50%;display:flex;
  align-items:center;justify-content:center;
}
.lateral{
  position:absolute;left:2%;top:50%;
  transform:translateY(-50%);
  display:flex;flex-direction:column;gap:10px;
}
.lat{
  width:75px;padding:10px 4px;
  background:#000b;border:1px solid #fff5;
  border-radius:12px;text-align:center;font-size:11px;
  font-weight:bold;
}
.lat span{display:block;font-size:22px}
.direita{
  position:absolute;right:2.5%;bottom:5%;
  display:flex;flex-direction:column;
  align-items:flex-end;gap:10px;
}
.modos{display:flex;gap:8px}
.modo{
  background:#000b;border:2px solid #fff5;
  border-radius:10px;padding:9px 12px;font-weight:bold;
}
.modo.ativo{border-color:#ffb300;color:#ffb300}
.modo.bloq{opacity:.6}
#iniciar{padding:13px 28px}

/* SALA DE ESPERA */

#sala{
  background:#000;
  overflow:hidden;
}

/* CENÁRIO DA SUA ILHA + PERSONAGENS DENTRO */

#mundo{
  position:absolute;
  inset:0;
  background:url("Screenshot_20261115-161520_Dola.png") center/cover no-repeat;
  transform-origin:center center;
  transform:scale(1.32) translate(0%,0%);
  will-change:transform;
}

.sala-escura{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,#0008,transparent 30%,#0004);
  pointer-events:none;
  z-index:3;
}

.topo-sala{
  position:absolute;top:3%;left:0;right:0;
  display:flex;justify-content:space-between;
  align-items:center;padding:0 3%;
  z-index:6;pointer-events:none;
}
.topo-dir{
  display:flex;align-items:center;gap:8px;
  pointer-events:auto;
}
.info-sala{
  background:#000b;border:1px solid #fff5;
  border-radius:10px;padding:8px 12px;
  font-weight:bold;font-size:clamp(11px,2.2vw,16px);
}
#sairIlha{
  padding:8px 12px;font-size:12px;
  background:#c62828;color:#fff;
  border-radius:10px;box-shadow:none;
  border:1px solid #fff5;
}

/* CONTADOR */

#contador{
  position:absolute;top:14%;left:50%;
  transform:translateX(-50%);
  background:#000c;border:2px solid #ffb300;
  border-radius:14px;padding:8px 20px;
  text-align:center;min-width:140px;
  z-index:6;pointer-events:none;
}
#tempo{
  color:#ffca28;font-size:clamp(26px,5vw,42px);
  font-weight:bold;line-height:1.1;
}
#mensagem-tempo{font-size:11px;letter-spacing:2px}
#sub-tempo{font-size:11px;letter-spacing:1px}

/* JOGADORES */

#vagas{
  position:absolute;bottom:3%;left:50%;
  transform:translateX(-50%);
  background:#000d;border:1px solid #ffb300;
  border-radius:12px;padding:8px 18px;
  font-weight:bold;font-size:clamp(12px,2.5vw,17px);
  white-space:nowrap;z-index:6;pointer-events:none;
}

/* BONECOS (JOGADOR E BOTS) */

.boneco{
  position:absolute;
  width:58px;
  height:98px;
  transform:translate(-50%,-88%);
  transform-origin:center bottom;
  pointer-events:none;
  will-change:left,top,transform;
}
.boneco .nome-tag{
  position:absolute;
  bottom:102%;
  left:50%;
  transform:translateX(-50%);
  background:#000a;
  color:#fff;
  font-size:10px;
  font-weight:bold;
  padding:2px 6px;
  border-radius:6px;
  white-space:nowrap;
  border:1px solid #fff3;
}
#jogador .nome-tag{
  color:#ffca28;
  border-color:#ffb300;
}
.boneco .sombra-chao{
  position:absolute;
  left:50%;bottom:2px;
  width:38px;height:10px;
  transform:translateX(-50%);
  background:#0007;
  border-radius:50%;
  transition:transform .2s;
}
.boneco .corpo-wrap{
  width:100%;height:100%;
  transform-origin:center bottom;
  transition:transform .12s;
}
.boneco svg{
  width:100%;height:100%;
  overflow:visible;
}

.boneco.olhar-esq svg{transform:scaleX(-1)}

.boneco.andando .corpo-wrap{
  animation:andar .28s infinite alternate ease-in-out;
}
@keyframes andar{
  0%{transform:translateY(0) rotate(-3deg)}
  100%{transform:translateY(-4px) rotate(3deg)}
}

.boneco.agachado .corpo-wrap{
  transform:scaleY(.72) scaleX(1.06);
}
.boneco.deitado .corpo-wrap{
  transform:translateY(-10px) rotate(88deg) scale(.85);
}

.boneco.pulando .corpo-wrap{
  animation:pulo .52s ease;
}
.boneco.pulando .sombra-chao{
  transform:translateX(-50%) scale(.6);
}
@keyframes pulo{
  0%,100%{transform:translateY(0)}
  45%{transform:translateY(-45px)}
}

.boneco.socando svg{
  animation:soco .32s ease;
}
@keyframes soco{
  0%,100%{transform:translateX(0) rotate(0)}
  40%{transform:translateX(10px) rotate(12deg)}
}
.boneco.olhar-esq.socando svg{
  animation:socoEsq .32s ease;
}
@keyframes socoEsq{
  0%,100%{transform:scaleX(-1) translateX(0) rotate(0)}
  40%{transform:scaleX(-1) translateX(10px) rotate(12deg)}
}

/* CONTROLES DE CELULAR */

#controles{
  position:absolute;
  inset:0;
  z-index:7;
  pointer-events:none;
}

/* JOYSTICK REDONDO */

#joystickArea{
  position:absolute;
  left:4%;
  bottom:8%;
  width:124px;
  height:124px;
  border-radius:50%;
  background:#0006;
  border:2px solid #fff6;
  pointer-events:auto;
  touch-action:none;
  display:flex;
  align-items:center;
  justify-content:center;
}
#joystickKnob{
  width:50px;
  height:50px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ffe082,#ffb300);
  border:2px solid #fff9;
  box-shadow:0 3px 8px #0009;
  pointer-events:none;
  transform:translate(0,0);
}

/* BOTÕES DE AÇÃO */

#acoes{
  position:absolute;
  right:3.5%;
  bottom:7%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  pointer-events:none;
}
.acao{
  width:62px;
  height:62px;
  border-radius:50%;
  padding:0;
  font-size:11px;
  color:white;
  background:#000b;
  border:2px solid #fff8;
  box-shadow:0 3px 0 #0008;
  pointer-events:auto;
  touch-action:none;
}
#pular{border-color:#ffca28}
#socar{border-color:#ff7043}
#agachar{border-color:#64b5f6}
#deitar{border-color:#80cbc4}
.acao.ativo{
  background:#ffb300;
  color:#222;
}

#toast{
  position:fixed;left:50%;top:14%;
  transform:translateX(-50%);
  background:#000d;border:1px solid #ffb300;
  padding:10px 18px;border-radius:20px;
  display:none;z-index:10;
}

#perfil{
  position:fixed;inset:0;background:#000b;
  display:none;z-index:8;
}
.av-grande{
  width:70px;height:70px;border-radius:50%;
  background:#ffb300;color:#222;font-size:34px;
  font-weight:bold;display:flex;
  align-items:center;justify-content:center;
}
#pNome{font-size:22px;font-weight:bold}
#pTipo,#pNivel{font-size:14px;color:#ffe082}
.linha{display:flex;gap:10px}

#girar{
  position:fixed;inset:0;background:#000;
  display:none;align-items:center;justify-content:center;
  text-align:center;font-size:20px;z-index:20;
  padding:20px;
}
@media(orientation:portrait){
  #girar{display:flex}
}
</style>
</head>

<body>

<div id="girar">Gire o celular<br>para o modo deitado</div>

<!-- ABERTURA -->

<div id="abertura" class="tela">
  <div class="sombra"></div>
  <div class="base">
    <div id="txt">CARREGANDO PARTIDA...</div>
    <div id="carga"><div id="barra"></div></div>
    <div id="pct">0%</div>
    <button id="comecar" style="display:none">COMEÇAR</button>
  </div>
</div>

<!-- NOME -->

<div id="nome" class="tela">
  <div class="escura"></div>
  <div class="caixa">
    <h2>ESCOLHA SEU NOME</h2>
    <input id="inpNome" maxlength="12" placeholder="Seu nome">
    <div id="erro"></div>
    <button id="confirmar">CONFIRMAR</button>
  </div>
</div>

<!-- PERSONAGEM -->

<div id="pers" class="tela">
  <div class="escura"></div>
  <div class="caixa">
    <h2>ESCOLHA SEU PERSONAGEM</h2>
    <div class="cards">
      <div class="card" id="masc">
        <svg viewBox="0 0 80 80">
          <circle cx="40" cy="44" r="18" fill="#e0b48a"/>
          <path d="M20 40 Q40 6 60 40 L60 34 Q40 0 20 34Z" fill="#4a5a2a"/>
          <rect x="26" y="38" width="28" height="9" rx="4" fill="#111"/>
          <rect x="14" y="62" width="52" height="18" rx="8" fill="#556b2f"/>
        </svg>
        MASCULINO
      </div>
      <div class="card" id="fem">
        <svg viewBox="0 0 80 80">
          <path d="M56 44 Q74 48 66 70 Q60 58 54 54Z" fill="#6b4a2b"/>
          <circle cx="40" cy="44" r="18" fill="#e0b48a"/>
          <path d="M20 40 Q40 6 60 40 L60 34 Q40 0 20 34Z" fill="#4a5a2a"/>
          <rect x="26" y="38" width="28" height="9" rx="4" fill="#111"/>
          <rect x="14" y="62" width="52" height="18" rx="8" fill="#556b2f"/>
        </svg>
        FEMININO
      </div>
    </div>
  </div>
</div>

<!-- LOBBY -->

<div id="lobby" class="tela">
  <div class="sombra"></div>

  <div class="moedas">
    <div class="pilula">💎 <span id="diamantes">0</span></div>
    <div class="pilula">🪙 <span id="ouro">0</span></div>
    <button id="avatar" class="peq">?</button>
  </div>

  <div class="lateral">
    <div class="lat" data-msg="Loja: em breve"><span>🛒</span>LOJA</div>
    <div class="lat" data-msg="Passe: em breve"><span>🎫</span>PASSE</div>
    <div class="lat" data-msg="Inventário: em breve"><span>🎒</span>INVENTÁRIO</div>
  </div>

  <div class="direita">
    <div class="modos">
      <div class="modo ativo" id="mClassico">CLÁSSICO</div>
      <div class="modo bloq" id="mRank">RANQUEADO</div>
    </div>
    <button id="iniciar">INICIAR PARTIDA</button>
  </div>
</div>

<!-- CARREGAMENTO DA ILHA -->

<div id="carregando" class="tela">
  <div class="escura"></div>
  <div class="base">
    <div id="textoCarga">CARREGANDO ILHA...</div>
    <div id="carga">
      <div id="barraIlha" style="width:0;height:100%;background:#ffb300"></div>
    </div>
    <div id="porcentagem">0%</div>
  </div>
</div>

<!-- SALA DE ESPERA -->

<div id="sala" class="tela">

  <!-- SUA ILHA + PERSONAGEM + BOTS DENTRO DELA -->
  <div id="mundo">
    <div id="camadaBots"></div>
    <div id="jogador" class="boneco"></div>
  </div>

  <div class="sala-escura"></div>

  <div class="topo-sala">
    <div class="info-sala">🏝️ ILHA DE ESPERA</div>
    <div class="topo-dir">
      <div class="info-sala">SALTO FINAL</div>
      <button id="sairIlha" class="peq">SAIR</button>
    </div>
  </div>

  <div id="contador">
    <div id="mensagem-tempo">AVIÃO EM</div>
    <div id="tempo">20</div>
    <div id="sub-tempo">SEGUNDOS</div>
  </div>

  <!-- CONTROLES -->

  <div id="controles">
    <div id="joystickArea">
      <div id="joystickKnob"></div>
    </div>

    <div id="acoes">
      <button class="acao" id="pular">PULAR</button>
      <button class="acao" id="socar">SOCAR</button>
      <button class="acao" id="agachar">AGACHAR</button>
      <button class="acao" id="deitar">DEITAR</button>
    </div>
  </div>

  <div id="vagas">👥 JOGADORES: 1/45</div>
</div>

<!-- PERFIL -->

<div id="perfil">
  <div class="caixa">
    <div class="av-grande" id="pAv">?</div>
    <div id="pNome"></div>
    <div id="pTipo"></div>
    <div id="pNivel">Nível 1</div>
    <div class="linha">
      <button id="trocar" class="peq">TROCAR NOME</button>
      <button id="fechar" class="peq">FECHAR</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
var $=function(i){return document.getElementById(i)};

var abertura=$('abertura');
var telaNome=$('nome');
var telaPers=$('pers');
var lobby=$('lobby');
var carregando=$('carregando');
var sala=$('sala');
var inp=$('inpNome');
var erro=$('erro');
var perfil=$('perfil');
var toast=$('toast');

function mostrar(t){
  [abertura,telaNome,telaPers,lobby,carregando,sala]
  .forEach(function(el){el.style.display='none'});
  t.style.display='block';
}

var avisoTimer;
function aviso(m){
  toast.textContent=m;
  toast.style.display='block';
  clearTimeout(avisoTimer);
  avisoTimer=setTimeout(function(){
    toast.style.display='none';
  },1800);
}

/* CARREGAMENTO INICIAL */

var p=0;
var t=setInterval(function(){
  p+=1.5;
  if(p>=100){
    p=100;
    clearInterval(t);
    $('txt').textContent='PRONTO!';
    $('carga').style.display='none';
    $('pct').style.display='none';
    $('comecar').style.display='block';
  }
  $('barra').style.width=p+'%';
  $('pct').textContent=Math.floor(p)+'%';
},70);

/* DADOS DO JOGADOR */

var salvo='';
var genero='';

try{
  salvo=localStorage.getItem('sf_nome')||'';
  genero=localStorage.getItem('sf_genero')||'';
}catch(e){}

function atualizarPerfil(){
  var ini=(salvo||'?').charAt(0).toUpperCase();
  $('avatar').textContent=ini;
  $('pAv').textContent=ini;
  $('pNome').textContent=salvo;
  $('pTipo').textContent='Personagem '+(genero==='fem'?'feminino':'masculino');
}

/* INÍCIO */

$('comecar').onclick=function(){
  inp.value=salvo;
  mostrar(telaNome);
};

$('confirmar').onclick=function(){
  var n=inp.value.trim();

  if(n.length<2){
    erro.textContent='Escolha um nome com 2 letras ou mais';
    return;
  }

  erro.textContent='';
  salvo=n;

  try{localStorage.setItem('sf_nome',n)}catch(e){}

  mostrar(telaPers);
};

/* PERSONAGEM */

function escolher(g){
  genero=g;
  try{localStorage.setItem('sf_genero',g)}catch(e){}
  atualizarPerfil();
  mostrar(lobby);
}

$('masc').onclick=function(){escolher('masc')};
$('fem').onclick=function(){escolher('fem')};

/* PERFIL */

$('avatar').onclick=function(){
  atualizarPerfil();
  perfil.style.display='block';
};

$('fechar').onclick=function(){
  perfil.style.display='none';
};

$('trocar').onclick=function(){
  perfil.style.display='none';
  inp.value=salvo;
  mostrar(telaNome);
};

/* BOTÕES LATERAIS */

document.querySelectorAll('.lat').forEach(function(el){
  el.onclick=function(){
    aviso(el.getAttribute('data-msg'));
  };
});

/* MODOS */

$('mClassico').onclick=function(){
  aviso('Modo Clássico selecionado');
};

$('mRank').onclick=function(){
  aviso('Ranqueado: em breve');
};

/* DESENHO DO BONECO (JOGADOR E BOTS) */

function montarBonecoHTML(nomeTxt,camisa,calca,cabelo,fem){
  var rabo=fem
    ? '<path d="M27 25 Q14 34 22 52 Q29 42 32 32Z" fill="'+cabelo+'"/>'
    : '';
  return ''
    +'<div class="nome-tag">'+nomeTxt+'</div>'
    +'<div class="sombra-chao"></div>'
    +'<div class="corpo-wrap">'
    +'<svg viewBox="0 0 100 170">'
      +'<path d="M35 105 L30 145 L23 160 L42 160 L48 112Z" fill="'+calca+'" stroke="#111" stroke-width="3"/>'
      +'<path d="M58 105 L64 143 L72 159 L89 159 L80 145 L77 105Z" fill="'+calca+'" stroke="#111" stroke-width="3"/>'
      +'<path d="M22 153 L42 153 L47 164 L18 164Z" fill="#171717"/>'
      +'<path d="M70 153 L88 153 L94 164 L69 164Z" fill="#171717"/>'
      +'<path d="M30 57 Q50 47 70 57 L79 112 Q50 128 21 112Z" fill="'+camisa+'" stroke="#172517" stroke-width="3"/>'
      +'<path d="M30 62 L15 91 L20 111 L30 107 L27 92 L42 75Z" fill="'+camisa+'" stroke="#172517" stroke-width="3"/>'
      +'<path d="M70 62 L85 91 L80 111 L70 107 L73 92 L58 75Z" fill="'+camisa+'" stroke="#172517" stroke-width="3"/>'
      +'<circle cx="20" cy="112" r="7" fill="#c58d68"/>'
      +'<circle cx="80" cy="112" r="7" fill="#c58d68"/>'
      +'<rect x="42" y="44" width="16" height="18" fill="#c58d68"/>'
      +rabo
      +'<ellipse cx="50" cy="29" rx="19" ry="24" fill="#c58d68" stroke="#704a35" stroke-width="2"/>'
      +'<path d="M31 25 Q31 3 50 5 Q69 3 69 25 Q58 15 48 18 Q39 16 31 25Z" fill="'+cabelo+'"/>'
      +'<circle cx="43" cy="31" r="2" fill="#111"/>'
      +'<circle cx="57" cy="31" r="2" fill="#111"/>'
      +'<path d="M39 58 L50 76 L61 58 L67 110 L33 110Z" fill="#b48b35" opacity=".88"/>'
    +'</svg>'
    +'</div>';
}

/* PAREDE INVISÍVEL DA AREIA (IMPEDE ENTRAR NA ÁGUA OU NO CÉU) */

function limitarNaAreia(x,y){
  var ny=Math.max(46,Math.min(89,y));
  var minX=39-((ny-46)/43)*19;
  var maxX=86-Math.max(0,(ny-74)*0.45);
  var nx=Math.max(minX,Math.min(maxX,x));
  return {x:nx,y:ny};
}

/* POSICIONAR BONECO COM ESCALA DE DISTÂNCIA E PROFUNDIDADE */

function aplicarPosicaoBoneco(el,x,y){
  el.style.left=x+'%';
  el.style.top=y+'%';
  var escala=0.58+((y-46)/43)*0.54;
  el.style.transform='translate(-50%,-88%) scale('+escala.toFixed(3)+')';
  el.style.zIndex=Math.floor(y*10);
}

/* JOGADOR E CÂMERA */

var jogador=$('jogador');
var mundo=$('mundo');

var posX=54;

/* JOYSTICK REDONDO POR TOQUE */

var joyArea=$('joystickArea');
var joyKnob=$('joystickKnob');
var joyPointer=null;

function atualizarJoystick(clientX,clientY){
  var rect=joyArea.getBoundingClientRect();
  var cx=rect.left+rect.width/2;
  var cy=rect.top+rect.height/2;
  var dx=clientX-cx;
  var dy=clientY-cy;
  var maxR=38;
  var dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>maxR){
    dx=(dx/dist)*maxR;
    dy=(dy/dist)*maxR;
  }
  joyKnob.style.transform='translate('+dx+'px, '+dy+'px)';
  joyX=dx/maxR;
  joyY=dy/maxR;
}

function soltarJoystick(){
  joyPointer=null;
  joyX=0;
  joyY=0;
  joyKnob.style.transform='translate(0,0)';
}

joyArea.addEventListener('pointerdown',function(e){
  e.preventDefault();
  joyPointer=e.pointerId;
  joyArea.setPointerCapture(e.pointerId);
  atualizarJoystick(e.clientX,e.clientY);
});
joyArea.addEventListener('pointermove',function(e){
  if(e.pointerId!==joyPointer)return;
  atualizarJoystick(e.clientX,e.clientY);
});
joyArea.addEventListener('pointerup',function(e){
  if(e.pointerId===joyPointer)soltarJoystick();
});
joyArea.addEventListener('pointercancel',function(e){
  if(e.pointerId===joyPointer)soltarJoystick();
});
joyArea.addEventListener('lostpointercapture',soltarJoystick);
