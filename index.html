<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Salto Final</title>
<style>
:root{
  --fundo-abertura:url("Screenshot_20261115-153556_Fotos~2.jpg");
  --fundo-lobby:url("Screenshot_20261115-133440_Dola.png");
  --fundo-espera:url("Screenshot_20261115-161520_Dola.png");
}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
.tela{position:fixed;inset:0;background:#000 center/cover no-repeat}
.sombra{position:absolute;inset:0;background:linear-gradient(to top,#000c 0%,#0000 45%)}
.escura{position:absolute;inset:0;background:#000a}
#abertura,#nome,#pers,#carreg{background-image:var(--fundo-abertura)}
#nome,#pers,#carreg{display:none}
#lobby{display:none;background-image:var(--fundo-lobby)}
#espera{display:none;background-image:var(--fundo-espera)}
#aviao{display:none;background:linear-gradient(#2f8fe8,#9fd6ff 70%,#d8f0ff)}
.base{position:absolute;left:0;right:0;bottom:6%;display:flex;flex-direction:column;align-items:center;gap:10px}
.txt{font-weight:bold;letter-spacing:2px;font-size:clamp(14px,3vw,22px);text-shadow:0 2px 6px #000}
.carga{width:60%;max-width:520px;height:14px;border-radius:10px;background:#0008;border:2px solid #fff8;overflow:hidden}
.barra{width:0;height:100%;background:linear-gradient(90deg,#ff6f00,#ffb300)}
.pct{font-size:clamp(12px,2.5vw,16px);color:#ffe082;text-shadow:0 2px 6px #000}
button{padding:14px 56px;font-size:clamp(18px,3.5vw,26px);font-weight:bold;border:none;border-radius:10px;background:#ffb300;color:#222;box-shadow:0 5px 0 #a66f00}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #a66f00}
button.peq{padding:8px 18px;font-size:14px;background:#000a;color:#fff;box-shadow:none;border:1px solid #fff6}
.caixa{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000c;padding:22px 28px;border-radius:14px;display:flex;flex-direction:column;gap:12px;align-items:center;min-width:280px}
.caixa h2{margin:0;color:#ffb300;letter-spacing:2px;font-size:clamp(18px,3.5vw,24px);text-align:center}
#inpNome{width:100%;box-sizing:border-box;padding:12px;font-size:20px;border-radius:8px;border:2px solid #ffb300;background:#111;color:#fff;text-align:center}
#erro{color:#ff8a80;font-size:14px;height:16px}
.cards{display:flex;gap:18px}
.card{width:150px;padding:14px 8px 12px;background:#111c;border:3px solid #fff4;border-radius:14px;text-align:center;font-weight:bold;letter-spacing:1px}
.card:active{border-color:#ffb300}
.card svg{width:80px;height:80px;display:block;margin:0 auto 8px}

.moedas{position:absolute;top:3%;right:2.5%;display:flex;gap:8px;align-items:center}
.pilula{background:#000b;border:1px solid #fff4;border-radius:20px;padding:5px 12px;font-weight:bold;font-size:clamp(13px,2.6vw,17px)}
#avatar{width:clamp(38px,7vw,48px);height:clamp(38px,7vw,48px);padding:0;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:none}
.lateral{position:absolute;left:2%;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.lat{width:clamp(62px,10vw,84px);padding:8px 4px;background:#000b;border:1px solid #fff4;border-radius:12px;text-align:center;font-size:clamp(10px,2vw,12px);font-weight:bold}
.lat span{display:block;font-size:clamp(18px,4vw,24px);margin-bottom:2px}
.lat:active{border-color:#ffb300}
.direita{position:absolute;right:2.5%;bottom:5%;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.modos{display:flex;gap:8px}
.modo{background:#000b;border:2px solid #fff4;border-radius:10px;padding:8px 14px;font-weight:bold;font-size:clamp(12px,2.6vw,16px)}
.modo.ativo{border-color:#ffb300;color:#ffb300}
.modo.bloq{opacity:.6}
#iniciar{padding:12px 44px;font-size:clamp(16px,3.2vw,22px)}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:#000d;border:1px solid #ffb300;padding:8px 18px;border-radius:20px;font-size:14px;display:none;z-index:20}
#perfil{position:fixed;inset:0;background:#000b;display:none;z-index:15}
.av-grande{width:70px;height:70px;border-radius:50%;background:#ffb300;color:#222;font-size:34px;font-weight:bold;display:flex;align-items:center;justify-content:center}
#pNome{font-size:22px;font-weight:bold}
#pTipo,#pNivel{font-size:14px;color:#ffe082}
.linha{display:flex;gap:10px}
#girar{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;text-align:center;font-size:20px;z-index:30;padding:20px}
@media (orientation:portrait){#girar{display:flex}}

.heroi{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);text-align:center}
.heroi svg{height:56vh;width:auto;filter:drop-shadow(0 8px 8px #0009)}
#lobNome{display:inline-block;margin-top:4px;background:#000b;border-radius:20px;padding:4px 16px;font-weight:bold;font-size:15px}

#sair{position:absolute;top:3%;left:2.5%;z-index:3}
#jogs{position:absolute;top:3%;right:2.5%;z-index:3}
.contagem{position:absolute;top:3%;left:0;right:0;text-align:center;text-shadow:0 2px 8px #000;pointer-events:none;z-index:3}
.contagem small{display:block;font-weight:bold;letter-spacing:2px;font-size:clamp(11px,2.4vw,15px)}
#cont{font-size:clamp(36px,10vw,64px);font-weight:bold;color:#ffb300;line-height:1}
#mundo{position:absolute;inset:0}
.bn{position:absolute;left:0;top:0;will-change:transform}
.bn svg{display:block;width:100%;height:auto;transform-origin:50% 100%}
.nm{position:absolute;left:50%;top:-15px;transform:translateX(-50%);font-size:10px;background:#0009;padding:1px 6px;border-radius:10px;white-space:nowrap}
.bn.eu .nm{background:#ffb300;color:#222;font-weight:bold}
#joy{position:absolute;left:4%;bottom:8%;width:120px;height:120px;border-radius:50%;background:#0006;border:2px solid #fff6;z-index:50;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:#fffa;transform:translate(-50%,-50%)}
.acao{position:absolute;right:4%;z-index:50;padding:14px 22px;font-size:16px;touch-action:none}
#bPular{bottom:22%}
#bAgachar{bottom:6%;background:#4fc3f7;box-shadow:0 5px 0 #1e7fa6}

.nuvem{position:absolute;width:140px;height:44px;border-radius:44px;background:#fffc;animation:nuvem linear infinite}
.nuvem::before{content:"";position:absolute;left:28px;top:-22px;width:60px;height:60px;border-radius:50%;background:#fffc}
@keyframes nuvem{from{transform:translateX(0)}to{transform:translateX(-140vw)}}
#plane{position:absolute;top:30%;left:-30%;width:clamp(180px,34vw,300px);animation:voo 20s linear forwards;pointer-events:none}
#plane svg{width:100%;display:block;animation:balanco 2s ease-in-out infinite}
@keyframes voo{from{left:-30%}to{left:105%}}
@keyframes balanco{50%{transform:translateY(8px) rotate(1.5deg)}}
.faixa{position:absolute;left:0;right:0;bottom:0;height:18%;background:linear-gradient(#1d8fb8,#0b5d86);pointer-events:none}
#saltar{position:absolute;right:4%;bottom:14%;z-index:50;background:#ff5722;color:#fff;box-shadow:0 5px 0 #a8330d;padding:18px 48px}
#tAviao{position:absolute;top:4%;left:0;right:0;text-align:center;font-weight:bold;font-size:clamp(14px,3vw,20px);color:#fff;text-shadow:0 2px 6px #0007}
</style>
</head>
<body>
<div id="girar">Gire o celular<br>para o modo deitado</div>

<div id="abertura" class="tela">
  <div class="sombra"></div>
  <div class="base">
    <div class="txt" id="txt">CARREGANDO PARTIDA...</div>
    <div class="carga" id="carga"><div class="barra" id="barra"></div></div>
    <div class="pct" id="pct">0%</div>
    <button id="comecar" style="display:none">COMEÇAR</button>
  </div>
</div>

<div id="nome" class="tela">
  <div class="escura"></div>
  <div class="caixa">
    <h2>ESCOLHA SEU NOME</h2>
    <input id="inpNome" type="text" maxlength="12" placeholder="Seu nome" autocomplete="off">
    <div id="erro"></div>
    <button id="confirmar">CONFIRMAR</button>
  </div>
</div>

<div id="pers" class="tela">
  <div class="escura"></div>
  <div class="caixa">
    <h2>ESCOLHA SEU PERSONAGEM</h2>
    <div class="cards">
      <div class="card" id="masc">
        <svg viewBox="0 0 80 80"><circle cx="40" cy="44" r="18" fill="#e0b48a"/><path d="M20 40 Q40 6 60 40 L60 34 Q40 0 20 34 Z" fill="#4a5a2a"/><rect x="26" y="38" width="28" height="9" rx="4" fill="#111"/><rect x="14" y="62" width="52" height="18" rx="8" fill="#556b2f"/></svg>
        MASCULINO
      </div>
      <div class="card" id="fem">
        <svg viewBox="0 0 80 80"><path d="M56 44 Q74 48 66 70 Q60 58 54 54 Z" fill="#6b4a2b"/><circle cx="40" cy="44" r="18" fill="#e0b48a"/><path d="M20 40 Q40 6 60 40 L60 34 Q40 0 20 34 Z" fill="#4a5a2a"/><rect x="26" y="38" width="28" height="9" rx="4" fill="#111"/><rect x="14" y="62" width="52" height="18" rx="8" fill="#556b2f"/></svg>
        FEMININO
      </div>
    </div>
  </div>
</div>

<div id="lobby" class="tela">
  <div class="sombra"></div>
  <div class="heroi"><div id="lobSvg"></div><span id="lobNome"></span></div>
  <div class="moedas">
    <div class="pilula">💎 <span id="diamantes">0</span></div>
    <div class="pilula">🪙 <span id="ouro">0</span></div>
    <button id="avatar" class="peq">?</button>
  </div>
  <div class="lateral">
    <div class="lat" data-msg="Loja: em breve"><span>🛒</span>LOJA</div>
    <div class="lat" data-msg="Passe: em breve"><span>🎫</span>PASSE</div>
    <div class="lat" data-msg="Inventário: em breve"><span>🎒</span>INVENTÁRIO</div>
  </div>
  <div class="direita">
    <div class="modos">
      <div class="modo ativo" id="mClassico">CLÁSSICO</div>
      <div class="modo bloq" id="mRank">RANQUEADO</div>
    </div>
    <button id="iniciar">INICIAR PARTIDA</button>
  </div>
</div>

<div id="carreg" class="tela">
  <div class="sombra"></div>
  <div class="base">
    <div class="txt" id="txt2">ENTRANDO NA PARTIDA...</div>
    <div class="carga"><div class="barra" id="barra2"></div></div>
    <div class="pct" id="pct2">0%</div>
  </div>
</div>

<div id="espera" class="tela">
  <div class="sombra"></div>
  <div id="mundo"></div>
  <button id="sair" class="peq">SAIR</button>
  <div class="pilula" id="jogs">👥 45/45</div>
  <div class="contagem"><small>A PARTIDA COMEÇA EM</small><div id="cont">20</div></div>
  <div id="joy"><div id="knob"></div></div>
  <button id="bPular" class="acao">PULAR</button>
  <button id="bAgachar" class="acao">AGACHAR</button>
</div>

<div id="aviao" class="tela">
  <div class="nuvem" style="top:12%;left:100%;animation-duration:18s"></div>
  <div class="nuvem" style="top:55%;left:100%;animation-duration:12s;animation-delay:-5s"></div>
  <div class="nuvem" style="top:70%;left:100%;animation-duration:25s;animation-delay:-14s"></div>
  <div class="faixa"></div>
  <div id="tAviao"></div>
  <div id="plane">
    <svg viewBox="0 0 300 100">
      <path d="M95 48 L40 8 L62 8 L128 46 Z" fill="#b0bec5"/>
      <path d="M20 40 L10 12 L34 12 L58 42 Z" fill="#90a4ae"/>
      <ellipse cx="160" cy="52" rx="130" ry="26" fill="#eceff1"/>
      <path d="M255 40 Q290 50 255 66 Q270 52 255 40 Z" fill="#cfd8dc"/>
      <ellipse cx="160" cy="62" rx="130" ry="10" fill="#ffb300" opacity=".85"/>
      <circle cx="215" cy="46" r="6" fill="#4fc3f7"/><circle cx="190" cy="46" r="6" fill="#4fc3f7"/><circle cx="165" cy="46" r="6" fill="#4fc3f7"/><circle cx="140" cy="46" r="6" fill="#4fc3f7"/>
      <path d="M270 50 Q292 52 270 60 Z" fill="#4fc3f7"/>
      <path d="M150 62 L100 98 L124 98 L186 64 Z" fill="#b0bec5"/>
    </svg>
  </div>
  <button id="saltar">SALTAR</button>
</div>

<div id="perfil">
  <div class="caixa">
    <div class="av-grande" id="pAv">?</div>
    <div id="pNome"></div>
    <div id="pTipo"></div>
    <div id="pNivel">Nível 1</div>
    <div class="linha">
      <button id="trocar" class="peq">TROCAR NOME</button>
      <button id="fechar" class="peq">FECHAR</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
var $=function(i){return document.getElementById(i)};
var barra=$('barra'),txt=$('txt'),pct=$('pct'),comecar=$('comecar'),carga=$('carga'),
    abertura=$('abertura'),telaNome=$('nome'),telaPers=$('pers'),lobby=$('lobby'),
    carreg=$('carreg'),espera=$('espera'),aviao=$('aviao'),
    inp=$('inpNome'),erro=$('erro'),toast=$('toast'),perfil=$('perfil');

var MAX_JOGADORES=45;
var TEMPO_ESPERA=20;
var ILHA={cx:.56,cy:.76,rx:.33,ry:.17};

function mostrar(t){
  [abertura,telaNome,telaPers,lobby,carreg,espera,aviao].forEach(function(e){e.style.display='none';});
  t.style.display='block';
}
var tt;
function aviso(m){
  toast.textContent=m;toast.style.display='block';
  clearTimeout(tt);tt=setTimeout(function(){toast.style.display='none';},1800);
}

var FUNDOS=['Screenshot_20261115-153556_Fotos~2.jpg','Screenshot_20261115-133440_Dola.png','Screenshot_20261115-161520_Dola.png'];
var pronto=0,total=FUNDOS.length;
function ok(){pronto++;}
FUNDOS.forEach(function(u){var im=new Image();im.onload=im.onerror=ok;im.src=u;});

var p=0;
var t=setInterval(function(){
  p+=Math.random()*2+0.8;
  if(p>90&&pronto<total)p=90;
  if(p>=100){
    p=100;clearInterval(t);
    txt.textContent='PRONTO!';carga.style.display='none';pct.style.display='none';
    comecar.style.display='block';
  }
  barra.style.width=p+'%';
  pct.textContent=Math.floor(p)+'%';
},100);

var salvo='',genero='';
try{salvo=localStorage.getItem('sf_nome')||'';genero=localStorage.getItem('sf_genero')||'';}catch(e){}

function boneco(g,cor){
  return '<svg viewBox="0 0 60 100"><rect x="18" y="62" width="9" height="30" rx="4" fill="#33402a"/><rect x="33" y="62" width="9" height="30" rx="4" fill="#33402a"/><rect x="14" y="34" width="32" height="34" rx="10" fill="'+cor+'"/><rect x="6" y="36" width="9" height="26" rx="4" fill="'+cor+'"/><rect x="45" y="36" width="9" height="26" rx="4" fill="'+cor+'"/><circle cx="30" cy="22" r="14" fill="#e0b48a"/><path d="M16 20 Q30 -4 44 20 L44 15 Q30 -8 16 15 Z" fill="#4a5a2a"/>'+(g==='fem'?'<path d="M42 22 Q56 28 50 48 Q46 36 40 32 Z" fill="#6b4a2b"/>':'')+'<rect x="20" y="19" width="20" height="7" rx="3" fill="#111"/></svg>';
}

function atualizarPerfil(){
  var ini=(salvo||'?').charAt(0).toUpperCase();
  $('avatar').textContent=ini;
  $('pAv').textContent=ini;
  $('pNome').textContent=salvo;
  $('pTipo').textContent='Personagem '+(genero==='fem'?'feminino':'masculino');
  $('lobSvg').innerHTML=boneco(genero,'#556b2f');
  $('lobNome').textContent=salvo;
}

comecar.onclick=function(){inp.value=salvo;mostrar(telaNome);};

$('confirmar').onclick=function(){
  var n=inp.value.trim();
  if(n.length<2){erro.textContent='Escolha um nome com 2 letras ou mais';return;}
  erro.textContent='';
  salvo=n;
  try{localStorage.setItem('sf_nome',n);}catch(e){}
  mostrar(telaPers);
};

function escolher(g){
  genero=g;
  try{localStorage.setItem('sf_genero',g);}catch(e){}
  atualizarPerfil();
  mostrar(lobby);
}
$('masc').onclick=function(){escolher('masc');};
$('fem').onclick=function(){escolher('fem');};

$('avatar').onclick=function(){atualizarPerfil();perfil.style.display='block';};
$('fechar').onclick=function(){perfil.style.display='none';};
$('trocar').onclick=function(){perfil.style.display='none';inp.value=salvo;mostrar(telaNome);};

var lats=document.querySelectorAll('.lat');
for(var i=0;i<lats.length;i++){
  (function(el){el.onclick=function(){aviso(el.getAttribute('data-msg'));};})(lats[i]);
}
$('mClassico').onclick=function(){aviso('Modo Clássico selecionado');};
$('mRank').onclick=function(){aviso('Ranqueado: em breve');};

var timerC=null,timerE=null,timerA=null,raf=0,rodando=false;
function parar(){
  clearInterval(timerC);clearInterval(timerE);clearInterval(timerA);
  rodando=false;cancelAnimationFrame(raf);
}
function irLobby(){parar();mostrar(lobby);}

function iniciarCarreg(){
  parar();
  var c=0,dicas=['Escolhendo o ponto de salto...','Reunindo os jogadores...','Preparando a ilha...'];
  $('barra2').style.width='0';$('pct2').textContent='0%';
  mostrar(carreg);
  timerC=setInterval(function(){
    c+=Math.random()*4+2;
    if(c>100)c=100;
    $('barra2').style.width=c+'%';
    $('pct2').textContent=Math.floor(c)+'%';
    $('txt2').textContent=dicas[Math.min(2,Math.floor(c/34))];
    if(c>=100){clearInterval(timerC);setTimeout(entrarIlha,300);}
  },100);
}
$('iniciar').onclick=iniciarCarreg;
$('sair').onclick=irLobby;

var W=innerWidth,H=innerHeight,ents=[],eu=null,jv={x:0,y:0},keys={},agach=false,ultimo=0;
var NOMES=['Lobo','Raio','Sombra','Tigre','Falcão','Ninja','Alpha','Dragão','Fênix','Trovão','Viper','Rei','Titan','Gato','Nova'];
var CORES=['#556b2f','#8d3b2f','#2f5d8d','#7a5c2a','#5b3b7a','#2f7a6c','#8a2f5a','#4a4a4a','#b8862b'];

function dentro(e){
  var dx=(e.x-ILHA.cx)/ILHA.rx,dy=(e.y-ILHA.cy)/ILHA.ry,l=Math.sqrt(dx*dx+dy*dy);
  if(l>1){e.x=ILHA.cx+dx/l*ILHA.rx;e.y=ILHA.cy+dy/l*ILHA.ry;return true;}
  return false;
}
function pontoIlha(){
  var a=Math.random()*6.283,r=Math.sqrt(Math.random())*.95;
  return {x:ILHA.cx+Math.cos(a)*ILHA.rx*r,y:ILHA.cy+Math.sin(a)*ILHA.ry*r};
}
function criar(nome,g,cor,bot){
  var pt=pontoIlha();
  var el=document.createElement('div');
  el.className='bn'+(bot?'':' eu');
  el.innerHTML=boneco(g,cor)+'<div class="nm"></div>';
  el.lastChild.textContent=nome;
  $('mundo').appendChild(el);
  return {x:pt.x,y:pt.y,z:0,vz:0,ag:false,el:el,svg:el.firstChild,bot:bot,tx:pt.x,ty:pt.y,t:Math.random()*2,parado:false};
}
function pular(e){if(e.z<=0){e.vz=H*0.75;}}

function entrarIlha(){
  parar();
  W=innerWidth;H=innerHeight;
  $('mundo').innerHTML='';ents=[];
  for(var i=0;i<MAX_JOGADORES-1;i++){
    ents.push(criar(NOMES[Math.floor(Math.random()*NOMES.length)]+(Math.floor(Math.random()*99)+1),Math.random()<.5?'fem':'masc',CORES[Math.floor(Math.random()*CORES.length)],true));
  }
  eu=criar(salvo,genero,'#556b2f',false);
  eu.x=ILHA.cx;eu.y=ILHA.cy;
  ents.push(eu);
  var seg=TEMPO_ESPERA;
  $('cont').textContent=seg;
  mostrar(espera);
  rodando=true;ultimo=performance.now();
  raf=requestAnimationFrame(laco);
  timerE=setInterval(function(){
    seg--;$('cont').textContent=seg;
    if(seg<=0){clearInterval(timerE);iniciarAviao();}
  },1000);
}

function laco(ts){
  if(!rodando)return;
  var dt=Math.min(.05,(ts-ultimo)/1000);ultimo=ts;
  var vel=H*.5;
  for(var i=0;i<ents.length;i++){
    var e=ents[i],mx=0,my=0;
    if(e===eu){
      mx=jv.x+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);
      my=jv.y+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);
      e.ag=agach||!!keys.Shift;
      var l=Math.sqrt(mx*mx+my*my);if(l>1){mx/=l;my/=l;}
    }else{
      e.t-=dt;
      if(e.t<=0){

}
